# ============================================================================
# NGINX: Reverse Proxy Configuration
# Propósito: Roteamento seguro, compressão, cache headers
# Segurança: Esconder versão, proteção contra ataques comuns
# ============================================================================

events {
    worker_connections 1024;
    use epoll;
}

http {
    # ========================================================================
    # SEGURANÇA: Headers de Proteção
    # ========================================================================
    # Esconder versão do Nginx
    server_tokens off;
    
    # Prevenir MIME type sniffing
    default_type application/octet-stream;
    include /etc/nginx/mime.types;
    
    # ========================================================================
    # PERFORMANCE: Compressão e caching
    # ========================================================================
    # Compressão GZIP
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/atom+xml image/svg+xml;
    
    # Buffering para melhor performance
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    
    # ========================================================================
    # LOGGING: Rastreamento de requisições
    # ========================================================================
    log_format gestoriq_combined '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent"';
    
    access_log /var/log/nginx/access.log gestoriq_combined;
    error_log /var/log/nginx/error.log warn;

    # ========================================================================
    # UPSTREAM: Backend (App Node.js)
    # Service Discovery: Resolução DNS automática
    # TA005: Custom Bridge Network - DNS interno nativo
    # ========================================================================
    upstream backend {
        # DNS resolution
        server app:3000;
        keepalive 32;
    }
    
    # ========================================================================
    # RATE LIMITING: Proteção contra abuso
    # ========================================================================
    # Limite de 10 requisições por segundo por IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    
    # ========================================================================
    # SERVER: Configuração principal
    # ========================================================================
    server {
        listen 80 default_server;
        server_name _;
        
        # ====================================================================
        # HEALTH CHECK ENDPOINT: Usado por Docker healthcheck
        # ====================================================================
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # ====================================================================
        # PROXY REVERSO: Rotear requisições para App
        # ====================================================================
        location / {
            # Aplicar rate limiting
            limit_req zone=general burst=20 nodelay;
            
            proxy_pass http://backend;
            
            # ================================================================
            # PROXY HEADERS: Informações corretas ao backend
            # ================================================================
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Host original
            proxy_set_header Host $host;
            
            # IP original do cliente
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Protocolo original (HTTP/HTTPS)
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Port original
            proxy_set_header X-Forwarded-Port $server_port;
            
            # ================================================================
            # TIMEOUTS: Evitar conexões presas
            # ================================================================
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # ================================================================
            # BUFFERING: Performance
            # ================================================================
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }
        
        # ====================================================================
        # API ENDPOINTS: Rate limiting mais permissivo
        # ====================================================================
        location ~ ^/api/ {
            limit_req zone=api burst=50 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ====================================================================
        # DOCUMENTAÇÃO: Swagger/OpenAPI
        # ====================================================================
        location ~ ^/api-docs {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        
        # ====================================================================
        # NEGAÇÃO: Bloquear arquivos sensíveis
        # ====================================================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # ====================================================================
        # HEADERS: Segurança
        # ====================================================================
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        
        # ====================================================================
        # CACHING: Headers de controle de cache
        # ====================================================================
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }
}
